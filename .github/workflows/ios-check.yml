              ;;
            *) exit 2 ;;
          esac
          # Normal push/PR/full-dispatch suites cover every UI test class once.
          # Broad rechecks retain all units; sports-refinement selects the changed
          # sports, profile and routing contracts plus their affected UI flows.
          if [ "$TEST_SUITE" = liquid-glass ]; then
            # Capture the actual held contact, expansion and release. A still
            # attachment taken after the gesture cannot establish motion.
            xcrun simctl io "$IOS_SIMULATOR_ID" recordVideo --codec=h264 ios/build/diagnostics/liquid-glass-thumb-motion.mp4 > ios/build/diagnostics/liquid-glass-recording.log 2>&1 &
            GLASS_MOTION_PID=$!
            xcodebuild test-without-building "${COMMON[@]}" "${TEST_OPTIONS[@]}" -only-testing:StreamifyUITests/LiquidGlassNavigationFlowTests/testRealThumbScrubCommitsReleasedTabAndTapsRemainIndependent -resultBundlePath ios/build/GlassMotion.xcresult
            kill -INT "$GLASS_MOTION_PID" 2>/dev/null || true
            wait "$GLASS_MOTION_PID" || true
            GLASS_MOTION_PID=''
            SELECTORS+=(-skip-testing:StreamifyUITests/LiquidGlassNavigationFlowTests/testRealThumbScrubCommitsReleasedTabAndTapsRemainIndependent)
          fi
          xcodebuild test-without-building "${COMMON[@]}" "${TEST_OPTIONS[@]}" "${SELECTORS[@]}" -resultBundlePath ios/build/Streamify.xcresult
      - name: Export simulator screenshots
        if: always()
        continue-on-error: true
        run: |
          for RESULT in ios/build/Streamify.xcresult ios/build/GlassMotion.xcresult; do
            if test -d "$RESULT"; then
              NAME=$(basename "$RESULT" .xcresult)
              xcrun xcresulttool export attachments --path "$RESULT" --output-path "ios/build/screenshots/$NAME"
              xcrun xcresulttool get test-results summary --path "$RESULT" > "ios/build/screenshots/$NAME/test-summary.json"
            fi
          done
      - name: Save test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-iOS-${{ matrix.suite }}-results
          path: |
            ios/build/*.xcresult
            ios/build/diagnostics
          if-no-files-found: ignore
      - name: Save viewable simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-iOS-${{ matrix.suite }}-screenshots
          path: ios/build/screenshots
          if-no-files-found: ignore
