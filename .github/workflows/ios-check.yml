name: iOS build and tests
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-*.yml']
  push:
    paths: ['ios/**', '.github/workflows/ios-*.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: Full regression or focused verification after the full baseline
        type: choice
        required: true
        default: full
        options: [full, ipad-visual, ipad-audit-recheck, ipad-finish, ipad-review, mlb-footer-recheck, server-memory-recheck, tennis-data-recheck, tennis-recheck, tennis-chat, player-download-repair, seek-preview-recheck, glass-placement-recheck, offline-ui-recheck, native-delta-research, native-minimal-research, native-transport-research, liquid-glass-recheck, hls-app-recheck, native-provider-research, hls-delivery-recheck, native-offline-research, native-download-research, native-hls-research, codec-diagnostics, download-provider-recheck, interaction-followup, interaction-recheck, delivery-recheck, download-source-recheck, multi-source-ui-recheck, stream-recovery-recheck, player-recheck, polish-recheck, sports-refinement, refinement-recheck, live-today-recheck, player-scene-recheck, profile-activation-recheck, native-fullscreen-recheck, football-polish-recheck, profile-picker-recheck, account-cache-recheck, cache-retap-recheck, provider-control-recheck, possession-widget-recheck, playback-start-recheck, landscape-touch-recheck, diamond-player-recheck, chat-connection-recheck]
permissions:
  contents: read
concurrency:
  # A device repair must not cancel an older run while it exports UI evidence.
  group: ios-check-${{ github.ref }}-${{ github.sha }}-${{ inputs.scope || github.event_name }}
  cancel-in-progress: true
jobs:
  native-hls-research:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'player-download-repair' || inputs.scope == 'native-hls-research' || inputs.scope == 'native-download-research' || inputs.scope == 'native-offline-research' || inputs.scope == 'hls-delivery-recheck' || inputs.scope == 'native-provider-research' || inputs.scope == 'native-transport-research' || inputs.scope == 'native-minimal-research' || inputs.scope == 'native-delta-research') }}
    name: Native HLS source feasibility
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated native research host
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/native-hls-diagnostics.yml
      - name: Check native playback or complete offline packages
        env:
          RESEARCH_SCOPE: ${{ inputs.scope }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          mkdir -p ios/build/hls-research
          RESEARCH_TESTS=(-only-testing:HLSResearchTests/VixSrcNativeHLSDiagnosticsTests)
          if [ "$RESEARCH_SCOPE" = player-download-repair ] || [ "$RESEARCH_SCOPE" = native-offline-research ] || [ "$RESEARCH_SCOPE" = hls-delivery-recheck ]; then RESEARCH_TESTS=(-only-testing:HLSResearchTests/NativeOfflineHLSLifecycleTests -only-testing:HLSResearchTests/VixSrcProductionResolverDiagnosticsTests -only-testing:HLSResearchTests/HLSOwnedPackageReferenceTests); fi
          if [ "$RESEARCH_SCOPE" = native-provider-research ]; then RESEARCH_TESTS=(-only-testing:HLSResearchTests/VixSrcCompleteEpisodeResearchTests); fi
          if [ "$RESEARCH_SCOPE" = native-transport-research ]; then RESEARCH_TESTS=(-only-testing:HLSResearchTests/NativeHLSFixtureTransportDiagnosticsTests); fi
          if [ "$RESEARCH_SCOPE" = native-minimal-research ]; then RESEARCH_TESTS=(-only-testing:HLSResearchTests/NativeHLSFixtureTransportDiagnosticsTests/testSingleVariantDefaultNativeDownload); fi
          if [ "$RESEARCH_SCOPE" = native-delta-research ]; then RESEARCH_TESTS=(-only-testing:HLSResearchTests/NativeHLSFixtureTransportDiagnosticsTests/testSingleVariantQualifierOnlyNativeDownload -only-testing:HLSResearchTests/NativeHLSFixtureTransportDiagnosticsTests/testSingleVariantEnglishSelectionOnlyNativeDownload -only-testing:HLSResearchTests/NativeHLSFixtureTransportDiagnosticsTests/testSingleVariantBothContentOverridesNativeDownload -only-testing:HLSResearchTests/NativeHLSFixtureTransportDiagnosticsTests/testIdentityAES128DefaultNativeDownload); fi
          set -o pipefail
          xcodebuild test -project ios/StreamifyHLSResearch.xcodeproj -scheme StreamifyHLSResearch -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/build/HLSResearch CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY='-' -parallel-testing-enabled NO "${RESEARCH_TESTS[@]}" -resultBundlePath ios/build/HLSResearch.xcresult | tee ios/build/hls-research/native.log
      - name: Export native feasibility evidence
        if: always()
        run: |
          if test -d ios/build/HLSResearch.xcresult; then
            xcrun xcresulttool export attachments --path ios/build/HLSResearch.xcresult --output-path ios/build/hls-research/attachments
            xcrun xcresulttool get test-results summary --path ios/build/HLSResearch.xcresult > ios/build/hls-research/test-summary.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Streamify-native-HLS-research
          path: |
            ios/build/hls-research/native.log
            ios/build/hls-research/test-summary.json
            ios/build/hls-research/attachments/**/*.json
          if-no-files-found: error
  codec-diagnostics:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'codec-diagnostics' || inputs.scope == 'native-download-research') }}
    name: Native iPhone codec diagnostics
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated project with the actual download implementation
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/codec-diagnostics.yml
      - name: Decode and play actual codec samples on iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          mkdir -p ios/build/codec-diagnostics
          set -o pipefail
          xcodebuild test -project ios/StreamifyCodecDiagnostics.xcodeproj -scheme StreamifyCodecDiagnostics -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/build/CodecDiagnostics CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY='-' -parallel-testing-enabled NO -resultBundlePath ios/build/CodecDiagnostics.xcresult | tee ios/build/codec-diagnostics/native.log
      - name: Export native diagnostic evidence
        if: always()
        run: |
          if test -d ios/build/CodecDiagnostics.xcresult; then
            xcrun xcresulttool export attachments --path ios/build/CodecDiagnostics.xcresult --output-path ios/build/codec-diagnostics/attachments
            xcrun xcresulttool get test-results summary --path ios/build/CodecDiagnostics.xcresult > ios/build/codec-diagnostics/test-summary.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Streamify-native-codec-diagnostics
          path: ios/build/codec-diagnostics
          if-no-files-found: error
  device:
    if: ${{ inputs.scope != 'ipad-visual' && inputs.scope != 'ipad-audit-recheck' && inputs.scope != 'offline-ui-recheck' && inputs.scope != 'native-provider-research' && inputs.scope != 'native-transport-research' && inputs.scope != 'native-minimal-research' && inputs.scope != 'native-delta-research' && inputs.scope != 'native-offline-research' && inputs.scope != 'native-download-research' && inputs.scope != 'native-hls-research' && inputs.scope != 'codec-diagnostics' && inputs.scope != 'download-provider-recheck' && (github.event_name != 'workflow_dispatch' || (inputs.scope != 'profile-activation-recheck' && inputs.scope != 'native-fullscreen-recheck' && inputs.scope != 'provider-control-recheck' && inputs.scope != 'landscape-touch-recheck')) }}
    name: iPhone test package
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build device package for local signing
        run: |
          xcodebuild build -project ios/Streamify.xcodeproj -scheme Streamify -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build/Device CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          mkdir -p ios/build/package/Payload
          ditto ios/build/Device/Build/Products/Release-iphoneos/Streamify.app ios/build/package/Payload/Streamify.app
          cd ios/build/package
          ditto -c -k --sequesterRsrc --keepParent Payload ../Streamify-unsigned.ipa
      - name: Save unsigned device package
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-iOS-unsigned-for-local-signing
          path: ios/build/Streamify-unsigned.ipa
          if-no-files-found: error
  simulator:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'native-provider-research' && inputs.scope != 'native-transport-research' && inputs.scope != 'native-minimal-research' && inputs.scope != 'native-delta-research' && inputs.scope != 'native-offline-research' && inputs.scope != 'native-download-research' && inputs.scope != 'codec-diagnostics' && inputs.scope != 'native-hls-research') }}
    name: iPhone UI - ${{ matrix.suite }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scope == 'ipad-visual' && '["ipad-visual"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'ipad-audit-recheck' && '["ipad-audit-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'ipad-finish' && '["ipad-finish", "iphone-finish"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'ipad-review' && '["ipad-catalog", "ipad-sports", "ipad-library", "ipad-playback", "iphone-pick"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'mlb-footer-recheck' && '["mlb-footer-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'server-memory-recheck' && '["server-memory-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'tennis-data-recheck' && '["tennis-data-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'tennis-recheck' && '["tennis-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'tennis-chat' && '["tennis-chat"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'player-download-repair' && '["offline-repair", "media-repair", "download-state-repair"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'seek-preview-recheck' && '["seek-preview"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'glass-placement-recheck' && '["glass-placement"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'offline-ui-recheck' && '["offline-ui-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'liquid-glass-recheck' && '["liquid-glass"]' || github.event_name == 'workflow_dispatch' && (inputs.scope == 'hls-delivery-recheck' || inputs.scope == 'hls-app-recheck') && '["download-hls"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'download-provider-recheck' && '["download-provider"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'interaction-followup' && '["navigation-media", "download-gesture", "download-provider"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'interaction-recheck' && '["navigation-media", "recent-sports", "download-gesture"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'delivery-recheck' && '["download-source", "source-deadline", "ui-regression"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'download-source-recheck' && '["download-source"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'multi-source-ui-recheck' && '["sources", "navigation-media"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'stream-recovery-recheck' && '["stream-recovery"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'chat-connection-recheck' && '["chat-connection"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'diamond-player-recheck' && '["diamond-player"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'landscape-touch-recheck' && '["landscape-touch"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'playback-start-recheck' && '["playback-start"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'possession-widget-recheck' && '["possession-widget"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'provider-control-recheck' && '["provider-control"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'cache-retap-recheck' && '["cache-retap"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'account-cache-recheck' && '["account-home", "cache-artwork"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'profile-picker-recheck' && '["profile-picker-recheck", "multiview-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'football-polish-recheck' && '["football-polish-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'native-fullscreen-recheck' && '["native-fullscreen-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'profile-activation-recheck' && '["profile-activation-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'player-scene-recheck' && '["scene-selector", "scene-restoration"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'live-today-recheck' && '["live-today-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'refinement-recheck' && '["profile-recheck", "game-center-recheck", "selector-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'sports-refinement' && '["sports-cards", "sports-player", "profiles-downloads"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'player-recheck' && '["player-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'polish-recheck' && '["polish-recheck"]' || '["playback", "controls", "screens", "profiles"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version
          xcodegen generate --spec ios/project.yml
      - name: Choose the review simulator
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          if [[ "$TEST_SUITE" == ipad-* ]]; then
            # The user's 12.9-inch Pro is 1024 x 1366 points. Create that exact
            # display instead of substituting a smaller iPad or a 13-inch model.
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["identifier"] for x in d["devicetypes"] if "iPad Pro" in x["name"] and "12.9" in x["name"] and "6th generation" in x["name"]))')
            RUNTIME=$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print([x["identifier"] for x in d["runtimes"] if x.get("isAvailable") and "iOS" in x["name"]][-1])')
            echo "Review model: $DEVICE_TYPE; runtime: $RUNTIME"
            DEVICE_ID=$(xcrun simctl create 'Streamify iPad Pro 12.9 review' "$DEVICE_TYPE" "$RUNTIME")
          else
            DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          fi
          echo "IOS_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          if ! xcrun simctl list devices booted --json | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any(x["udid"] == sys.argv[1] for devices in d["devices"].values() for x in devices) else 1)' "$DEVICE_ID"; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build all test targets and verify assigned screens
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p ios/build/diagnostics
          # Keep a small process sample if a UI interaction leaves the simulator
          # busy, so a failed screen check can be diagnosed from its actual stack.
          (
            while sleep 60; do
              for APP_PID in $(pgrep -x Streamify || true); do
                sample "$APP_PID" 1 1 -file "ios/build/diagnostics/Streamify-$APP_PID-$(date +%s).txt" >/dev/null 2>&1 || true
              done
            done
          ) &
          DIAGNOSTIC_PID=$!
          GLASS_MOTION_PID=''
          trap 'if [ -n "$GLASS_MOTION_PID" ]; then kill -INT "$GLASS_MOTION_PID" 2>/dev/null || true; wait "$GLASS_MOTION_PID" 2>/dev/null || true; fi; kill "$DIAGNOSTIC_PID" 2>/dev/null || true' EXIT
          COMMON=(-project ios/Streamify.xcodeproj -scheme Streamify -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" -derivedDataPath ios/build/Simulator CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY='-')
          TEST_OPTIONS=(-parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 360)
          xcodebuild build-for-testing "${COMMON[@]}"
          # Keep suite assignments explicit so each screen check runs once.
          case "$TEST_SUITE" in
            ipad-visual)
              SELECTORS=(-only-testing:StreamifyUITests/IPadLayoutFlowTests -only-testing:StreamifyUITests/MultiWatchRotationFlowTests)
              ;;
            ipad-audit-recheck)
              SELECTORS=(-only-testing:StreamifyUITests/TennisFlowTests/testTennisShowsAllToursThenFiltersAndOpensSetScoring -only-testing:StreamifyUITests/ParityFlowTests/testSportsSingleLeagueCalendarKeepsSelectionAndPosition -only-testing:StreamifyUITests/ParityFlowTests/testSportsChannelsAndMultiwatchPreserveSelectedServerAndTile -only-testing:StreamifyUITests/ParityFlowTests/testMovieTrailerDownloadQualityCastSheetAndDragReturn)
              ;;
            ipad-finish)
              SELECTORS=(-only-testing:StreamifyUITests/AccountCacheFlowTests/testExplicitGoogleAndEmailSignInOpenHomeWithAccountViewerWithoutChooser -only-testing:StreamifyUITests/AccountCacheFlowTests/testGoogleCancelKeepsGuestAndFavoriteGenresHaveUniformTilesAndPersist -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testNativeSystemPictureInPictureKeepsTheSelectedGameWhileBrowsing -only-testing:StreamifyUITests/MediaWatchFlowTests/testMovieWatchRespondsAtBothVisibleEdgesWhileTrailerIsPresent -only-testing:StreamifyTests/MoviePickTests -only-testing:StreamifyTests/AdaptiveLayoutTests -only-testing:StreamifyTests/ProfileStoreTests -only-testing:StreamifyTests/MediaDownloadResolverTests -only-testing:StreamifyUITests/IPadLayoutFlowTests -only-testing:StreamifyUITests/MoviePickFlowTests -only-testing:StreamifyUITests/ParityFlowTests/testBaseballFooterAdaptsToLargeTextInLightMode -only-testing:StreamifyUITests/ParityFlowTests/testSportsChannelsAndMultiwatchPreserveSelectedServerAndTile -only-testing:StreamifyUITests/ParityFlowTests/testMovieTrailerDownloadQualityCastSheetAndDragReturn)
              ;;
            iphone-finish)
              SELECTORS=(-only-testing:StreamifyTests/MoviePickTests -only-testing:StreamifyUITests/MoviePickFlowTests -only-testing:StreamifyUITests/DynamicIslandFlowTests -only-testing:StreamifyUITests/ParityFlowTests/testBaseballFooterAdaptsToLargeTextInLightMode -only-testing:StreamifyUITests/MediaWatchFlowTests)
              ;;
            ipad-catalog)
              SELECTORS=(-only-testing:StreamifyTests/MoviePickTests -only-testing:StreamifyTests/AdaptiveLayoutTests -only-testing:StreamifyUITests/IPadLayoutFlowTests -only-testing:StreamifyUITests/MoviePickFlowTests -only-testing:StreamifyUITests/ControlInteractionFlowTests/testCategoryGenreProviderAndSortControlsForEveryMediaKind -only-testing:StreamifyUITests/ParityFlowTests/testMovieShowAnimeCategoriesAndSearch -only-testing:StreamifyUITests/ParityFlowTests/testMovieTrailerDownloadQualityCastSheetAndDragReturn -only-testing:StreamifyUITests/ParityFlowTests/testShowEpisodeDownloadsAndPlayerEpisodePicker -only-testing:StreamifyUITests/ControlInteractionFlowTests/testCollectionsGenreActuallyFiltersAndRestoresDirectory)
              ;;
            ipad-sports)
              SELECTORS=(-only-testing:StreamifyUITests/ParityFlowTests/testSportsScheduleScoringTableRosterChannelsAndMultiWatch -only-testing:StreamifyUITests/ParityFlowTests/testFinalGameHasGroupedPlayByPlayAndBothTeamsPlayerTables -only-testing:StreamifyUITests/ParityFlowTests/testSportsSingleLeagueCalendarKeepsSelectionAndPosition -only-testing:StreamifyUITests/ParityFlowTests/testSportsChannelsAndMultiwatchPreserveSelectedServerAndTile -only-testing:StreamifyUITests/SportsChatFlowTests -only-testing:StreamifyUITests/TennisFlowTests)
              ;;
            ipad-library)
              SELECTORS=(-only-testing:StreamifyUITests/AccountCacheFlowTests/testExplicitGoogleAndEmailSignInOpenHomeWithAccountViewerWithoutChooser -only-testing:StreamifyUITests/AccountCacheFlowTests/testGoogleCancelKeepsGuestAndFavoriteGenresHaveUniformTilesAndPersist -only-testing:StreamifyUITests/ParityFlowTests/testLibraryPosterDimensionsDownloadsSettingsAccountAndCollections -only-testing:StreamifyUITests/AccountFlowTests -only-testing:StreamifyUITests/ProfileFlowTests -only-testing:StreamifyUITests/DownloadIndicatorFlowTests -only-testing:StreamifyUITests/ControlInteractionFlowTests/testLibraryKindFilterAndHistoryOverflowApplyToExactTitle)
              ;;
            ipad-playback)
              SELECTORS=(-only-testing:StreamifyUITests/OfflinePlayerFlowTests -only-testing:StreamifyUITests/MediaWatchFlowTests -only-testing:StreamifyUITests/MediaAutoplayDismissFlowTests -only-testing:StreamifyUITests/SportsPlaybackFlowTests -only-testing:StreamifyUITests/MultiWatchRotationFlowTests)
              ;;
            iphone-pick)
              SELECTORS=(-only-testing:StreamifyTests/MoviePickTests -only-testing:StreamifyTests/AdaptiveLayoutTests -only-testing:StreamifyUITests/DynamicIslandFlowTests -only-testing:StreamifyUITests/MoviePickFlowTests -only-testing:StreamifyUITests/MediaWatchFlowTests -only-testing:StreamifyUITests/ParityFlowTests/testRootTabsUseTapNavigationAndLeaveCarouselsIndependent)
              ;;
            mlb-footer-recheck)
              SELECTORS=(-only-testing:StreamifyTests/SportsLiveSituationTests -only-testing:StreamifyUITests/ParityFlowTests/testBaseballDiamondUsesLiveBaseStatesAndSymmetricFieldLayout -only-testing:StreamifyUITests/ParityFlowTests/testBaseballFooterAdaptsToLargeTextInLightMode)
              ;;
            server-memory-recheck)
              SELECTORS=(-only-testing:StreamifyTests/SportsPlaybackSessionTests -only-testing:StreamifyTests/ProfileStoreTests -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testGameAndStreamSelectorsSwitchIndependentlyAndKeepOnePlayer)
              ;;
            tennis-data-recheck)
              SELECTORS=(-only-testing:StreamifyTests/TennisCoverageTests -only-testing:StreamifyTests/SportsTennisTests)
              ;;
            tennis-recheck)
              SELECTORS=(-only-testing:StreamifyTests -only-testing:StreamifyUITests/TennisFlowTests -only-testing:StreamifyUITests/ParityFlowTests/testBaseballDiamondUsesLiveBaseStatesAndSymmetricFieldLayout -only-testing:StreamifyUITests/ParityFlowTests/testBasketballPossessionIconSitsImmediatelyBeforeTheCorrectScoreForBothLeagues)
              ;;
            tennis-chat)
              SELECTORS=(-only-testing:StreamifyTests -only-testing:StreamifyUITests/TennisFlowTests -only-testing:StreamifyUITests/SportsChatFlowTests -only-testing:StreamifyUITests/SportsMultiProviderFlowTests)
              ;;
            offline-repair)
                SELECTORS=(
                  -only-testing:StreamifyTests/OfflineSeekControllerTests
                  -only-testing:StreamifyTests/OfflinePlaybackTests
                  -only-testing:StreamifyTests/OfflineSeekPreviewTests
                  -only-testing:StreamifyUITests/OfflinePlayerFlowTests/testCachedPosterAndActualLocalPlaybackControls
                )
                ;;
            media-repair)
                SELECTORS=(
                  -only-testing:StreamifyUITests/MediaAutoplayDismissFlowTests
                  -only-testing:StreamifyTests/ProviderPlaybackRoutingTests
                  -only-testing:StreamifyTests/ProviderPopupProtectionTests
                  -only-testing:StreamifyTests/SportsPlaybackSessionTests/testMatchoraAdvertisedEmbedsUseIframeAfterOpeningAndChangingSources
                  -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testSportsBlocksPopupsWithoutInterceptingPlayerControls
                  -only-testing:StreamifyTests/SportsPlayerDismissTests
                  -only-testing:StreamifyUITests/MediaWatchFlowTests
                  -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testSportsWatchAutoplaysReadyVideoAndPreservesAnExplicitPause
                  -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testSportsFullscreenUsesTheProvidersOwnControlAndKeepsItsDocument
                )
                ;;
            download-state-repair)
                SELECTORS=(
                  -only-testing:StreamifyTests/SportsStreamProviderTests
                  -only-testing:StreamifyTests/SportsSourceAggregationTests
                  -only-testing:StreamifyTests/MatchoraProviderTests
                  -only-testing:StreamifyTests/DaddyLiveProviderTests
                  -only-testing:StreamifyTests/HLSRestorationLifecycleTests
                  -only-testing:StreamifyTests/HLSDownloadStateTests
                  -only-testing:StreamifyTests/HLSDownloadPolicyTests
                  -only-testing:StreamifyTests/HLSOwnedPackageReferenceTests
                  -only-testing:StreamifyTests/DownloadLibraryGroupingTests
                  -only-testing:StreamifyUITests/NativeHLSDownloadFlowTests/testReal1080EnglishHLSDownloadPlaysPersistsRelaunchAndDeletesThroughEpisodeUI
                )
                ;;
            offline-ui-recheck)
