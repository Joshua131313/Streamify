name: iOS build and tests
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-*.yml']
  push:
    paths: ['ios/**', '.github/workflows/ios-*.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: Full regression or focused verification after the full baseline
        type: choice
        required: true
        default: full
        options: [full, player-recheck, polish-recheck, sports-refinement, refinement-recheck, live-today-recheck, player-scene-recheck, profile-activation-recheck, native-fullscreen-recheck, football-polish-recheck, profile-picker-recheck, account-cache-recheck, cache-retap-recheck, provider-control-recheck, possession-widget-recheck]
permissions:
  contents: read
concurrency:
  # A device repair must not cancel an older run while it exports UI evidence.
  group: ios-check-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  device:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'profile-activation-recheck' && inputs.scope != 'native-fullscreen-recheck' && inputs.scope != 'provider-control-recheck') }}
    name: iPhone test package
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build device package for local signing
        run: |
          xcodebuild build -project ios/Streamify.xcodeproj -scheme Streamify -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build/Device CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          mkdir -p ios/build/package/Payload
          ditto ios/build/Device/Build/Products/Release-iphoneos/Streamify.app ios/build/package/Payload/Streamify.app
          cd ios/build/package
          ditto -c -k --sequesterRsrc --keepParent Payload ../Streamify-unsigned.ipa
      - name: Save unsigned device package
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-iOS-unsigned-for-local-signing
          path: ios/build/Streamify-unsigned.ipa
          if-no-files-found: error
  simulator:
    name: iPhone UI - ${{ matrix.suite }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scope == 'possession-widget-recheck' && '["possession-widget"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'provider-control-recheck' && '["provider-control"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'cache-retap-recheck' && '["cache-retap"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'account-cache-recheck' && '["account-home", "cache-artwork"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'profile-picker-recheck' && '["profile-picker-recheck", "multiview-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'football-polish-recheck' && '["football-polish-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'native-fullscreen-recheck' && '["native-fullscreen-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'profile-activation-recheck' && '["profile-activation-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'player-scene-recheck' && '["scene-selector", "scene-restoration"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'live-today-recheck' && '["live-today-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'refinement-recheck' && '["profile-recheck", "game-center-recheck", "selector-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'sports-refinement' && '["sports-cards", "sports-player", "profiles-downloads"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'player-recheck' && '["player-recheck"]' || github.event_name == 'workflow_dispatch' && inputs.scope == 'polish-recheck' && '["polish-recheck"]' || '["playback", "controls", "screens"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version
          xcodegen generate --spec ios/project.yml
      - name: Choose an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "IOS_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          if ! xcrun simctl list devices booted --json | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any(x["udid"] == sys.argv[1] for devices in d["devices"].values() for x in devices) else 1)' "$DEVICE_ID"; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build all test targets and verify assigned screens
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p ios/build/diagnostics
          # Keep a small process sample if a UI interaction leaves the simulator
          # busy, so a failed screen check can be diagnosed from its actual stack.
          (
            while sleep 60; do
              for APP_PID in $(pgrep -x Streamify || true); do
                sample "$APP_PID" 1 1 -file "ios/build/diagnostics/Streamify-$APP_PID-$(date +%s).txt" >/dev/null 2>&1 || true
              done
            done
          ) &
          DIAGNOSTIC_PID=$!
          trap 'kill "$DIAGNOSTIC_PID" 2>/dev/null || true' EXIT
          COMMON=(-project ios/Streamify.xcodeproj -scheme Streamify -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" -derivedDataPath ios/build/Simulator CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY='-')
          TEST_OPTIONS=(-parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 360)
          xcodebuild build-for-testing "${COMMON[@]}"
          # Keep suite assignments explicit so each screen check runs once.
          case "$TEST_SUITE" in
            possession-widget)
              SELECTORS=(
                -only-testing:StreamifyTests/SportsLiveSituationTests
                -only-testing:StreamifyTests/SportsWidgetPolicyTests
                -only-testing:StreamifyUITests/ParityFlowTests/testBasketballPossessionIconSitsImmediatelyBeforeTheCorrectScoreForBothLeagues
                -only-testing:StreamifyUITests/ParityFlowTests/testGameCenterWatchActionUsesACompactButtonWithAnAccessibleTapTarget
                -only-testing:StreamifyUITests/ParityFlowTests/testLivePregameFinalTabsKeepLeagueAndFutureDatePolicy
              )
              ;;
            provider-control)
              SELECTORS=(-only-testing:StreamifyUITests/SportsPlaybackFlowTests/testSportsFullscreenUsesTheProvidersOwnControlAndKeepsItsDocument)
              ;;
            cache-retap)
              SELECTORS=(
                -only-testing:StreamifyTests/SportsScheduleCacheTests
                -only-testing:StreamifyUITests/AccountCacheFlowTests/testLeagueRoundTripsReuseNetworkResultsAndNeverEnterLoadingAgain
              )
              ;;
            account-home)
              SELECTORS=(
                -only-testing:StreamifyTests/AccountSessionTests
                -only-testing:StreamifyTests/ProfileSyncTests
                -only-testing:StreamifyUITests/AccountCacheFlowTests/testExplicitGoogleAndEmailSignInOpenHomeWithAccountViewerWithoutChooser
                -only-testing:StreamifyUITests/AccountCacheFlowTests/testGoogleCancelKeepsGuestAndFavoriteGenresHaveUniformTilesAndPersist
              )
              ;;
            cache-artwork)
              SELECTORS=(
                -only-testing:StreamifyTests/SportsPlayerLayoutTests
                -only-testing:StreamifyTests/SportsScheduleCacheTests
                -only-testing:StreamifyTests/HistoryArtworkTests
                -only-testing:StreamifyTests/MediaDownloadResolverTests
                -only-testing:StreamifyTests/ResponseMemoryCacheTests
                -only-testing:StreamifyUITests/AccountCacheFlowTests/testLeagueRoundTripsReuseNetworkResultsAndNeverEnterLoadingAgain
                -only-testing:StreamifyUITests/AccountCacheFlowTests/testContinueWatchingRepairsMissingMetadataAndRetriesFailedBackdrop
                -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testLandscapeVideoFillsCanvasAndRotationKeepsTheSameStreamDocument
                -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testSportsFullscreenUsesTheProvidersOwnControlAndKeepsItsDocument
              )
              ;;
            profile-picker-recheck)
              SELECTORS=(-only-testing:StreamifyUITests/QuickProfileFlowTests)
              ;;
            multiview-recheck)
              SELECTORS=(
                -only-testing:StreamifyTests/SportsMultiWatchAudioTests
                -only-testing:StreamifyUITests/MultiWatchRotationFlowTests
              )
              ;;
            football-polish-recheck)
              SELECTORS=(
                -only-testing:StreamifyTests/SportsLiveSituationTests
                -only-testing:StreamifyUITests/ParityFlowTests/testFootballFieldMirrorsPossessionForNFLAndCollegeFootball
              )
              ;;
            native-fullscreen-recheck)
              SELECTORS=(-only-testing:StreamifyUITests/SportsPlaybackFlowTests/testProviderNativeVideoFullscreenPresentsAboveTheSportsWindowAndKeepsItsSource)
              ;;
            profile-activation-recheck)
              SELECTORS=(-only-testing:StreamifyUITests/QuickProfileFlowTests)
              ;;
            scene-selector)
              SELECTORS=(
                -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testGameAndStreamSelectorsSwitchIndependentlyAndKeepOnePlayer
                -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testSelectedSportsSourceAndDocumentSurviveBackgroundRoundTrip
                -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testClosedSportsPlayerStaysClosedAfterSwitchingTabs
              )
              ;;
            scene-restoration)
              SELECTORS=(
                -only-testing:StreamifyTests/SportsPlaybackSessionTests
                -only-testing:StreamifyTests/SportsPlayerDismissTests
                -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testProviderElementFullscreenBackgroundRestoreKeepsTheVideoSurfaceInteractive
                -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testProviderNativeVideoFullscreenPresentsAboveTheSportsWindowAndKeepsItsSource
                -only-testing:StreamifyUITests/SportsPlaybackFlowTests/testSwipeDownSportsPlayerCancelsWithoutReloadingThenReturnsToItsGameCard
              )
              ;;
            live-today-recheck)
              SELECTORS=(
                -only-testing:StreamifyUITests/ParityFlowTests/testLivePregameFinalTabsKeepLeagueAndFutureDatePolicy
                -only-testing:StreamifyUITests/ControlInteractionFlowTests/testSportsSearchReturnsToItsSelectedLeaguesAndFutureDate
              )
              ;;
            profile-recheck)
              SELECTORS=(-only-testing:StreamifyUITests/ProfileFlowTests)
              ;;
            game-center-recheck)
              SELECTORS=(
                -only-testing:StreamifyUITests/ParityFlowTests/testSportsScheduleScoringTableRosterChannelsAndMultiWatch
                -only-testing:StreamifyUITests/ParityFlowTests/testFinalSportsScoringHighlightsTheActualWinner
              )
              ;;
            selector-recheck)
              SELECTORS=(-only-testing:StreamifyUITests/SportsPlaybackFlowTests/testGameAndStreamSelectorsSwitchIndependentlyAndKeepOnePlayer)
              ;;
            sports-cards)
              SELECTORS=(
                -only-testing:StreamifyTests/SportsLiveSituationTests
                -only-testing:StreamifyTests/SportsResultTests
                -only-testing:StreamifyTests/SportsContractTests
                -only-testing:StreamifyTests/SportsMidnightScheduleTests
                -only-testing:StreamifyTests/SportsHomeOrderTests
                -only-testing:StreamifyTests/SportsDaySwipeGateTests
                -only-testing:StreamifyUITests/CardInteractionFlowTests/testSportsTeamHoldsKeepIndependentFollowActionsAndTapOpensExactTeam
                -only-testing:StreamifyUITests/ParityFlowTests/testBaseballDiamondUsesLiveBaseStatesAndSymmetricFieldLayout
                -only-testing:StreamifyUITests/ParityFlowTests/testSportsSingleLeagueCalendarKeepsSelectionAndPosition
                -only-testing:StreamifyUITests/ParityFlowTests/testLivePregameFinalTabsKeepLeagueAndFutureDatePolicy
                -only-testing:StreamifyUITests/ParityFlowTests/testCollegeFootballLeagueOpensItsGameAndAvailableStream
                -only-testing:StreamifyUITests/ParityFlowTests/testSportsScheduleScoringTableRosterChannelsAndMultiWatch
                -only-testing:StreamifyUITests/ParityFlowTests/testFinalSportsScoringHighlightsTheActualWinner
                -only-testing:StreamifyUITests/ControlInteractionFlowTests/testSportsSingleLeagueTabsFollowingAndTodayReset
                -only-testing:StreamifyUITests/ControlInteractionFlowTests/testSportsSearchReturnsToItsSelectedLeaguesAndFutureDate
              )
              ;;
            sports-player)
              SELECTORS=(
                -only-testing:StreamifyTests/SportsPlaybackSessionTests
                -only-testing:StreamifyTests/SportsPlayerDismissTests
                -only-testing:StreamifyUITests/SportsPlaybackFlowTests
                -only-testing:StreamifyUITests/ParityFlowTests/testSportsChannelsAndMultiwatchPreserveSelectedServerAndTile
              )
              ;;
            profiles-downloads)
              SELECTORS=(
                -only-testing:StreamifyTests/ProfileStoreTests
                -only-testing:StreamifyTests/AppQuickActionTests
                -only-testing:StreamifyUITests/ProfileFlowTests
                -only-testing:StreamifyUITests/QuickActionFlowTests/testQueuedColdActionsOpenDownloadsFavoritesAndSports
                -only-testing:StreamifyUITests/QuickActionFlowTests/testWidgetSportsAndWatchURLsRouteWarmAndColdWithoutReplayingClosedPlayer
                -only-testing:StreamifyUITests/DownloadIndicatorFlowTests/testSingleEpisodeShowPagePreservesExactSwipeActionsAndReturnsAfterLastRemoval
                -only-testing:StreamifyUITests/ParityFlowTests/testRootTabsUseTapNavigationAndLeaveCarouselsIndependent
              )
              ;;
            polish-recheck)
              SELECTORS=(-only-testing:StreamifyTests -only-testing:StreamifyUITests/AccountFlowTests -only-testing:StreamifyUITests/CardInteractionFlowTests -only-testing:StreamifyUITests/ParityFlowTests/testLivePregameFinalTabsKeepLeagueAndFutureDatePolicy -only-testing:StreamifyUITests/ParityFlowTests/testCollegeFootballLeagueOpensItsGameAndAvailableStream -only-testing:StreamifyUITests/ControlInteractionFlowTests/testSportsSingleLeagueTabsFollowingAndTodayReset)
              ;;
            player-recheck)
              SELECTORS=(-only-testing:StreamifyTests -only-testing:StreamifyUITests/SportsPlaybackFlowTests -only-testing:StreamifyUITests/OfflinePlayerFlowTests/testCachedPosterAndActualLocalPlaybackControls -only-testing:StreamifyUITests/ParityFlowTests/testSportsChannelsAndMultiwatchPreserveSelectedServerAndTile)
              ;;
            playback)
              SELECTORS=(-only-testing:StreamifyTests -only-testing:StreamifyUITests/SportsPlaybackFlowTests -only-testing:StreamifyUITests/MultiWatchRotationFlowTests -only-testing:StreamifyUITests/DownloadIndicatorFlowTests -only-testing:StreamifyUITests/QuickActionFlowTests -only-testing:StreamifyUITests/SportsChatFlowTests -only-testing:StreamifyUITests/ControlInteractionFlowTests/testSearchFieldAndHeaderPresentFullSearchAndReturnToTheirOriginalContext -only-testing:StreamifyUITests/ControlInteractionFlowTests/testSportsSearchReturnsToItsSelectedLeaguesAndFutureDate)
              ;;
            controls)
              SELECTORS=(-only-testing:StreamifyUITests/ControlInteractionFlowTests -skip-testing:StreamifyUITests/ControlInteractionFlowTests/testSearchFieldAndHeaderPresentFullSearchAndReturnToTheirOriginalContext -skip-testing:StreamifyUITests/ControlInteractionFlowTests/testSportsSearchReturnsToItsSelectedLeaguesAndFutureDate -only-testing:StreamifyUITests/CardInteractionFlowTests -only-testing:StreamifyUITests/OfflinePlayerFlowTests -only-testing:StreamifyUITests/OfflineRecoveryFlowTests -only-testing:StreamifyUITests/ProfileFlowTests -only-testing:StreamifyUITests/QuickProfileFlowTests -only-testing:StreamifyUITests/AccountFlowTests -only-testing:StreamifyUITests/NavigationTests)
              ;;
            screens)
              SELECTORS=(-only-testing:StreamifyUITests/ParityFlowTests)
              ;;
            *) exit 2 ;;
          esac
          # Normal push/PR/full-dispatch suites cover every UI test class once.
          # Broad rechecks retain all units; sports-refinement selects the changed
          # sports, profile and routing contracts plus their affected UI flows.
          xcodebuild test-without-building "${COMMON[@]}" "${TEST_OPTIONS[@]}" "${SELECTORS[@]}" -resultBundlePath ios/build/Streamify.xcresult
      - name: Export simulator screenshots
        if: always()
        continue-on-error: true
        run: |
          for RESULT in ios/build/Streamify.xcresult; do
            if test -d "$RESULT"; then
              NAME=$(basename "$RESULT" .xcresult)
              xcrun xcresulttool export attachments --path "$RESULT" --output-path "ios/build/screenshots/$NAME"
              xcrun xcresulttool get test-results summary --path "$RESULT" > "ios/build/screenshots/$NAME/test-summary.json"
            fi
          done
      - name: Save test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-iOS-${{ matrix.suite }}-results
          path: |
            ios/build/*.xcresult
            ios/build/diagnostics
          if-no-files-found: ignore
      - name: Save viewable simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-iOS-${{ matrix.suite }}-screenshots
          path: ios/build/screenshots
          if-no-files-found: ignore
