name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique CFBundleVersion greater than previously uploaded builds
        type: string
        required: true
      upload:
        description: Upload the signed build to App Store Connect for TestFlight
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_WIDGET_BUNDLE_ID: ${{ vars.IOS_WIDGET_BUNDLE_ID }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Test signing validation
        run: python3 ios/scripts/testflight_signing_test.py
      - name: Validate and prepare distribution signing
        env:
          IOS_UPLOAD: ${{ inputs.upload }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: python3 ios/scripts/testflight_signing.py prepare
      - name: Install distribution certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/streamify-testflight/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/streamify-testflight/signing.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          python3 ios/scripts/testflight_signing.py verify-identity
      - name: Generate and archive
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec ios/.testflight-project.json
          xcodebuild archive -project ios/Streamify.xcodeproj -scheme Streamify -configuration Release -destination 'generic/platform=iOS' -archivePath ios/build/Streamify.xcarchive CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER"
          xcodebuild -exportArchive -archivePath ios/build/Streamify.xcarchive -exportPath ios/build/export -exportOptionsPlist "$RUNNER_TEMP/streamify-testflight/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: Streamify-signed-iOS
          path: ios/build/export/*.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/ios/build/export/Streamify.ipa"
          # altool searches ./private_keys; keep the key in our isolated temp directory.
          cd "$RUNNER_TEMP/streamify-testflight"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/streamify-testflight/signing.keychain-db" >/dev/null 2>&1 || true
          python3 ios/scripts/testflight_signing.py cleanup
