name: StreamifyHLSResearch
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
targets:
  HLSResearchHost:
    type: application
    platform: iOS
    sources:
      - path: NativeHLSDiagnostics/ResearchHost.swift
      - path: Streamify/Downloads/CatalogDownloadSource.swift
      - path: Streamify/Downloads/OfflineVideoValidation.swift
      - path: Streamify/Downloads/OfflineHLSValidation.swift
      - path: Streamify/Downloads/HLSDownloadSessionOwner.swift
      - path: Streamify/Downloads/VixSrcDownloadResolver.swift
      - path: Streamify/Data/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.hlsresearch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        SUPPORTS_MACCATALYST: NO
  HLSResearchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NativeHLSDiagnostics/VixSrcNativeHLSDiagnosticsTests.swift
      - path: NativeHLSDiagnostics/NativeOfflineHLSLifecycleTests.swift
      - path: NativeHLSDiagnostics/VixSrcProductionResolverDiagnosticsTests.swift
      - path: NativeHLSDiagnostics/VixSrcCompleteEpisodeResearchTests.swift
    dependencies:
      - target: HLSResearchHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.hlsresearch.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HLSResearchHost.app/HLSResearchHost
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  StreamifyHLSResearch:
    build:
      targets:
        HLSResearchHost: all
        HLSResearchTests: [test]
    test:
      targets: [HLSResearchTests]
