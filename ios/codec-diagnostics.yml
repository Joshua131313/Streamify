name: StreamifyCodecDiagnostics
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
targets:
  Streamify:
    type: framework
    platform: iOS
    sources:
      - path: Streamify/Downloads/OfflineVideoValidation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.codecdiagnostics
  StreamifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreamifyTests/HEVCPackagingDiagnosticsTests.swift
      - path: StreamifyTests/Fixtures/hevc-hvc1-aac-1080.mp4
      - path: StreamifyTests/Fixtures/hevc-hev1-aac-1080.mp4
      - path: StreamifyTests/Fixtures/from-s1e1-daratech-native-first-second.mp4
    dependencies:
      - target: Streamify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.codecdiagnostics.tests
schemes:
  StreamifyCodecDiagnostics:
    build:
      targets:
        Streamify: all
        StreamifyTests: [test]
    test:
      targets: [StreamifyTests]
