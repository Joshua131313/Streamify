name: Streamify
options:
  bundleIdPrefix: com.streamify
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.1.1'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Streamify:
    type: application
    platform: iOS
    sources:
      - path: Streamify
        excludes:
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
      - path: Streamify/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.app
        PRODUCT_NAME: Streamify
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Streamify/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - StreamifyTests
        - StreamifyUITests
      gatherCoverageData: true
  StreamifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreamifyTests
    dependencies:
      - target: Streamify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.app.tests
        GENERATE_INFOPLIST_FILE: YES
  StreamifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StreamifyUITests
    dependencies:
      - target: Streamify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.app.uitests
        GENERATE_INFOPLIST_FILE: YES
