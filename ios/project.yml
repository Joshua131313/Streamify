name: Streamify
options:
  bundleIdPrefix: com.streamify
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.1.2'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.1.0
targets:
  Streamify:
    type: application
    platform: iOS
    sources:
      - path: Streamify
        excludes:
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
      - path: Streamify/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: StreamifyWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.app
        PRODUCT_NAME: Streamify
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Streamify/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        OTHER_LDFLAGS: '$(inherited) -ObjC'
    scheme:
      testTargets:
        - StreamifyTests
        - StreamifyUITests
      gatherCoverageData: true
  StreamifyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StreamifyWidgets
        excludes:
          - Info.plist
      - path: Streamify/Sports/SportsModels.swift
      - path: Streamify/Sports/SportsService.swift
      - path: Streamify/Sports/SportsSourceIdentity.swift
      - path: Streamify/Sports/StreamFreeProvider.swift
      - path: Streamify/Sports/DaddyLiveProvider.swift
      - path: Streamify/Data/ResponseMemoryCache.swift
      - path: Streamify/Sports/SportsWidgetPolicy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.app.widgets
        PRODUCT_NAME: StreamifyWidgets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StreamifyWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
  StreamifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreamifyTests
    dependencies:
      - target: Streamify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.app.tests
        GENERATE_INFOPLIST_FILE: YES
  StreamifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StreamifyUITests
    dependencies:
      - target: Streamify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamify.app.uitests
        GENERATE_INFOPLIST_FILE: YES
